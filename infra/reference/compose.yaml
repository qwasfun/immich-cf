name: immich-cf-reference
services:
  server:
    image: ghcr.io/immich-app/immich-server@sha256:4351dd621899ecc8ed317ae87cdcaeb968ec8ba4f9d8053d913a73eb6f6dd7c2
    platform: linux/amd64
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_CF_REFERENCE_PASSWORD:?set isolated reference password}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    ports:
      - '127.0.0.1:22830:2283'
    volumes:
      - media:/data
    depends_on:
      - redis
      - database
    restart: 'no'
  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    restart: 'no'
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_CF_REFERENCE_PASSWORD:?set isolated reference password}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - database:/var/lib/postgresql/data
    shm_size: 128mb
    restart: 'no'
volumes:
  media:
  database:
