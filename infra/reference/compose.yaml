name: immich-cf-reference
services:
  server:
    image: ghcr.io/immich-app/immich-server@sha256:96c6ec77cdea5a3c90539b81baf8c276b834deb595b1603c4aefc1903ab6a05b
    platform: linux/amd64
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_CF_REFERENCE_PASSWORD:?set isolated reference password}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    ports:
      - '127.0.0.1:22830:2283'
    volumes:
      - media:/data
    depends_on:
      - redis
      - database
    restart: 'no'
  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    restart: 'no'
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_CF_REFERENCE_PASSWORD:?set isolated reference password}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - database:/var/lib/postgresql/data
    shm_size: 128mb
    restart: 'no'
volumes:
  media:
  database:
